<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --ink:#0E2A33; --muted:#52666C; --line:#D2DEDB;
  --primary:#0B5563; --on-primary:#FFFFFF; --sun:#E8A800;
  --ok:#1B7A46; --ok-bg:#E3F3EA; --bad:#B42318; --bad-bg:#FBE9E7;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1A1F; --surface:#13262D; --ink:#E7F0EF; --muted:#9DB2B6; --line:#254049;
    --primary:#5CC2D1; --on-primary:#06222A; --sun:#F0B429;
    --ok:#5FD38D; --ok-bg:#123A25; --bad:#FF9A8F; --bad-bg:#3F1A17;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px 56px}
h1,h2,.q,.score{font-family:Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif}
h1{font-size:31px;line-height:1.15;margin:10px 0 6px;letter-spacing:-.01em}
h2{font-size:20px;line-height:1.3;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 24px}
.meta{color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c,var(--primary));border-radius:6px;padding:12px 14px;margin:0 0 10px}
.row b{display:block;font-size:17px}
.row.mix{background:var(--primary);color:var(--on-primary);border-color:var(--primary);border-left-color:var(--sun);padding:16px 14px;margin-bottom:18px}
.row.mix .meta{color:inherit;opacity:.9}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--primary));transition:width .3s}

.weak{margin:0;padding:0;list-style:none}
.weak li{padding:10px 0;border-bottom:1px solid var(--line)}
.weak li:last-child{border-bottom:0}
.empty{color:var(--muted);margin:0}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.back{background:none;border:0;padding:10px 4px;min-height:44px;font-weight:600;color:var(--primary)}
.prog{margin:0 0 20px}
.tema{margin:0 0 6px;color:var(--muted);font-size:14px}
.q{font-size:22px;line-height:1.35;margin:0 0 20px;font-weight:600}

.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 10px;min-height:54px}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.65}
.opt[aria-disabled="true"]{cursor:default}

.fb{border-radius:8px;padding:14px;margin:6px 0 14px;background:var(--surface);border:2px solid var(--line)}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fb strong{display:block;margin-bottom:4px}

.btn{display:block;width:100%;min-height:50px;border-radius:8px;border:2px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:600;padding:10px 16px;margin:0 0 10px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:42px;font-size:14px;font-weight:500;margin-top:30px}

.score{font-size:68px;line-height:1;margin:14px 0 4px}
.score small{font-size:26px;color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin:26px 0 0}

@media (prefers-reduced-motion: reduce){ .bar i{transition:none} }
</style>
</head>

const KEY = "treino-exames:v1";
let hist = { s:{}, t:{}, n:0 };
let S = { view:"home", mode:null, pool:[], i:0, picked:null, score:0, wrong:[], confirmReset:false };
const root = document.getElementById("app");

async function load(){
  try{
    let raw = null;
    try{ raw = localStorage.getItem(KEY); }catch(e){}
    if(raw === null && window.storage){
      try{ const r = await window.storage.get(KEY); raw = r && r.value; }catch(e){}
    }
    if(raw) hist = JSON.parse(raw);
  }catch(e){ /* começa sem histórico */ }
  render();
}
async function save(){
  const raw = JSON.stringify(hist);
  try{ localStorage.setItem(KEY, raw); return; }catch(e){}
  try{ if(window.storage) await window.storage.set(KEY, raw); }catch(e){}
}

const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const prep = (q, s) => {
  const idx = shuffle([0,1,2,3]);
  return { src:q, sid:s.id, sn:s.nome, cor:s.cor, t:q.t, q:q.q, o:idx.map(k=>q.o[k]), c:idx.indexOf(q.c), e:q.e };
};

function start(mode){
  let pool;
  if(mode === "misto"){
    pool = shuffle(SUBJECTS.flatMap(s => s.qs.map(q => prep(q, s)))).slice(0, 12);
  } else if(mode === "erros"){
    pool = shuffle(S.wrong.map(w => prep(w.src, SUBJECTS.find(x => x.id === w.sid))));
  } else {
    const s = SUBJECTS.find(x => x.id === mode);
    pool = shuffle(s.qs.map(q => prep(q, s)));
  }
  S = { ...S, view:"quiz", mode: mode === "erros" ? S.mode : mode, pool, i:0, picked:null, score:0, wrong:[] };
}

function answer(k){
  if(S.picked !== null) return;
  const p = S.pool[S.i];
  S.picked = k;
  const ok = k === p.c;
  if(ok) S.score++; else S.wrong.push({ sid:p.sid, src:p.src, t:p.t, sn:p.sn });
  const a = hist.s[p.sid] || (hist.s[p.sid] = { a:0, k:0 });
  a.a++; if(ok) a.k++;
  const key = p.sid + "|" + p.t;
  const t = hist.t[key] || (hist.t[key] = { a:0, k:0, sn:p.sn, t:p.t });
  t.a++; if(ok) t.k++;
  save();
}

function next(){
  if(S.i + 1 < S.pool.length){ S.i++; S.picked = null; }
  else { S.view = "result"; hist.n++; save(); }
}

function viewHome(){
  const rows = SUBJECTS.map(s => {
    const a = hist.s[s.id];
    const pct = a ? Math.round(a.k / a.a * 100) : 0;
    const info = a ? `${s.qs.length} perguntas, ${a.k} certas em ${a.a} respostas (${pct}%)` : `${s.qs.length} perguntas, ainda sem respostas`;
    return `<button class="row" style="--c:${s.cor}" data-a="start" data-m="${s.id}"><b>${s.nome}</b><span class="meta">${info}</span><div class="bar"><i style="width:${pct}%"></i></div></button>`;
  }).join("");

  const weak = Object.values(hist.t)
    .filter(t => t.a >= 2 && t.k / t.a < 0.6)
    .sort((x, y) => x.k / x.a - y.k / y.a)
    .slice(0, 5);
  const weakHtml = weak.length
    ? `<ul class="weak">${weak.map(t => `<li><b>${t.t}</b><br><span class="meta">${t.sn}: ${t.k} certas em ${t.a} respostas</span></li>`).join("")}</ul>`
    : `<p class="empty">Os temas em que mais errar vão aparecer aqui, para saber o que estudar primeiro.</p>`;

  return `
    <h1>Treino para exames de admissão</h1>
    <p class="sub">Moçambique. Seis disciplinas, com correcção e explicação logo a seguir a cada resposta.</p>
    <button class="row mix" data-a="start" data-m="misto"><b>Simulado misto</b><span class="meta">12 perguntas sorteadas das 6 disciplinas</span></button>
    ${rows}
    <h2>Temas a reforçar</h2>
    ${weakHtml}
    <button class="btn ghost small" data-a="reset">${S.confirmReset ? "Confirmar: apagar todo o histórico" : "Apagar histórico"}</button>
    <p class="note">Perguntas de treino, não oficiais. Compare sempre com o programa do exame.</p>`;
}

function viewQuiz(){
  const p = S.pool[S.i], n = S.pool.length, done = S.picked !== null;
  const opts = p.o.map((txt, k) => {
    let cls = "opt", mark = String.fromCharCode(65 + k);
    if(done){
      if(k === p.c){ cls += " ok"; mark = "✓"; }
      else if(k === S.picked){ cls += " bad"; mark = "✗"; }
      else cls += " dim";
    }
    return `<button class="${cls}" data-a="pick" data-k="${k}" ${done ? 'aria-disabled="true"' : ""}><span class="l">${mark}</span><span>${txt}</span></button>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = S.picked === p.c;
    fb = `<div class="fb ${ok ? "ok" : "bad"}" role="status"><strong>${ok ? "Certa." : "Errada. Resposta certa: " + p.o[p.c]}</strong>${p.e}</div>
          <button class="btn" id="next" data-a="next">${S.i + 1 < n ? "Próxima pergunta" : "Ver resultado"}</button>`;
  }
  return `
    <div class="top"><button class="back" data-a="home">← Sair</button><span class="meta">${p.sn}, pergunta ${S.i + 1} de ${n}</span></div>
    <div class="bar prog" style="--c:${p.cor}"><i style="width:${(S.i + (done ? 1 : 0)) / n * 100}%"></i></div>
    <p class="tema">Tema: ${p.t}</p>
    <h2 class="q">${p.q}</h2>
    ${opts}${fb}`;
}

function viewResult(){
  const n = S.pool.length, pct = Math.round(S.score / n * 100);
  const msg = pct >= 80 ? "Bom resultado." : pct >= 50 ? "Resultado razoável: vale rever os temas abaixo." : "Vale a pena repetir, começando pelos temas abaixo.";
  const temas = [...new Set(S.wrong.map(w => w.sn + ": " + w.t))];
  const temasHtml = temas.length
    ? `<h2>Temas para rever</h2><ul class="weak">${temas.map(t => `<li>${t}</li>`).join("")}</ul>`
    : `<p class="empty">Nenhum erro nesta ronda.</p>`;
  return `
    <h1>${msg}</h1>
    <div class="score">${S.score}<small> de ${n} (${pct}%)</small></div>
    ${temasHtml}
    <div style="margin-top:24px">
      ${S.wrong.length ? `<button class="btn" data-a="wrong">Rever só as que errei</button>` : ""}
      <button class="btn ${S.wrong.length ? "ghost" : ""}" data-a="again">Repetir</button>
      <button class="btn ghost" data-a="home">Voltar ao início</button>
    </div>`;
}

function render(){
  root.innerHTML = S.view === "home" ? viewHome() : S.view === "quiz" ? viewQuiz() : viewResult();
  if(S.view === "quiz" && S.picked !== null){
    const b = document.getElementById("next");
    if(b) b.focus();
  } else {
    window.scrollTo(0, 0);
  }
}

root.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if(!b) return;
  const a = b.dataset.a;
  if(a === "start") start(b.dataset.m);
  else if(a === "pick") answer(+b.dataset.k);
  else if(a === "next") next();
  else if(a === "home"){ S.view = "home"; S.confirmReset = false; }
  else if(a === "again") start(S.mode);
  else if(a === "wrong") start("erros");
  else if(a === "reset"){
    if(!S.confirmReset) S.confirmReset = true;
    else { hist = { s:{}, t:{}, n:0 }; S.confirmReset = false; save(); }
  }
  render();
});

render();
load();

if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
