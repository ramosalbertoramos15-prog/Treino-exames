<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treino para exames de admissão</title>
<meta name="theme-color" content="#0B5563">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino Exames">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --ink:#0E2A33; --muted:#52666C; --line:#D2DEDB;
  --primary:#0B5563; --on-primary:#FFFFFF; --sun:#E8A800;
  --ok:#1B7A46; --ok-bg:#E3F3EA; --bad:#B42318; --bad-bg:#FBE9E7; --sel-bg:#E4F0F2;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1A1F; --surface:#13262D; --ink:#E7F0EF; --muted:#9DB2B6; --line:#254049;
    --primary:#5CC2D1; --on-primary:#06222A; --sun:#F0B429;
    --ok:#5FD38D; --ok-bg:#123A25; --bad:#FF9A8F; --bad-bg:#3F1A17; --sel-bg:#12353D;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
sup,sub{line-height:0}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px 56px}
h1,h2,.q,.score{font-family:Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif}
h1{font-size:30px;line-height:1.15;margin:10px 0 6px;letter-spacing:-.01em}
h1.sh{border-left:8px solid var(--c);padding-left:12px}
h2{font-size:20px;line-height:1.3;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 22px}
.meta{color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.row,.act{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:0 0 10px}
.row{border-left:8px solid var(--c,var(--primary))}
.row b,.act b{display:block;font-size:17px}
.act{padding:14px}
.row.mix{background:var(--primary);color:var(--on-primary);border-color:var(--primary);border-left-color:var(--sun);padding:16px 14px;margin-bottom:18px}
.row.mix .meta{color:inherit;opacity:.9}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--primary));transition:width .3s}

.weak{margin:0;padding:0;list-style:none}
.weak li{padding:10px 0;border-bottom:1px solid var(--line)}
.weak li:last-child{border-bottom:0}
.weak button{display:block;width:100%;text-align:left;background:none;border:0;padding:0;min-height:44px}
.weak b{display:block}
.empty{color:var(--muted);margin:0}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.back{background:none;border:0;padding:10px 4px;min-height:44px;font-weight:600;color:var(--primary)}
.prog{margin:0 0 20px}
.tema{margin:0 0 6px;color:var(--muted);font-size:14px}
.q{font-size:22px;line-height:1.35;margin:0 0 20px;font-weight:600}

.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 10px;min-height:54px}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--primary);background:var(--sel-bg)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.65}
.opt[aria-disabled="true"]{cursor:default}

.fb{border-radius:8px;padding:14px;margin:6px 0 14px;background:var(--surface);border:2px solid var(--line)}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fb strong{display:block;margin-bottom:4px}

.estudo{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 16px 6px;margin:0 0 18px}
.estudo ul{padding-left:20px;margin:12px 0}
.estudo li{margin:0 0 10px}
.estudo p{margin:12px 0}

.btn{display:block;width:100%;min-height:50px;border-radius:8px;border:2px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:600;padding:10px 16px;margin:0 0 10px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:42px;font-size:14px;font-weight:500;margin-top:30px}

.score{font-size:68px;line-height:1;margin:14px 0 4px}
.score small{font-size:26px;color:var(--muted)}
.rev{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--bad);border-radius:6px;padding:12px 14px;margin:0 0 12px}
.rev p{margin:4px 0}
.rev .rq{font-weight:600}
.note{color:var(--muted);font-size:13px;margin:26px 0 0}


/* ===== Exames ===== */
.row.exm{background:var(--surface);border-left-color:var(--sun)}
.row.exm.mix2{background:var(--primary);color:var(--on-primary);border-color:var(--primary);border-left-color:var(--sun);padding:16px 14px;margin-bottom:18px}
.row.exm.mix2 .meta{color:inherit;opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--bg)}
.chip.best{border-color:var(--ok);color:var(--ok)}
.hd{display:flex;align-items:center;gap:10px;margin:28px 0 10px}
.hd h2{margin:0}
.hd i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.aviso{background:var(--sel-bg);border:1px solid var(--line);border-left:6px solid var(--sun);border-radius:6px;padding:12px 14px;margin:0 0 16px;font-size:14px;color:var(--ink)}
.txt{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:0 0 18px;padding:0 14px}
.txt summary{cursor:pointer;font-weight:600;padding:12px 0;min-height:44px;color:var(--primary)}
.txt div{padding:0 6px 6px 0;font-size:15px;max-height:36vh;overflow:auto;-webkit-overflow-scrolling:touch}
.txt p{margin:0 0 10px}
.dub{background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:8px 10px;margin:10px 0 0;font-size:13px;color:var(--muted)}
.fb .ans{display:block;margin:2px 0 6px}
.row2{display:flex;gap:10px}
.row2 .btn{margin:0}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
@media (prefers-color-scheme: dark){.btn.ok,.btn.bad{color:#06120b}}
.tm{margin:0 0 14px}
.tm .meta{display:flex;justify-content:space-between;gap:8px}
details.rv{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:6px;margin:0 0 8px}
details.rv.bad{border-left-color:var(--bad)}
details.rv summary{cursor:pointer;padding:10px 12px;min-height:44px;display:flex;gap:10px;align-items:flex-start;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv .st{flex:none;font-weight:700;color:var(--ok)}
details.rv.bad .st{color:var(--bad)}
details.rv .rvb{padding:0 14px 12px}
details.rv .rvb p{margin:6px 0}

@media (prefers-reduced-motion: reduce){ .bar i{transition:none} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="dados-mat.js"></script>
<script src="dados-qui.js"></script>
<script src="dados-por.js"></script>
<script src="dados-his.js"></script>
<script src="dados-geo.js"></script>
<script src="dados-bio.js"></script>
<script src="dados-fil.js"></script>
<script src="dados-fis.js"></script>
<script src="dados-exames.js"></script>
<script>
const IDS = ["mat","fis","qui","fil","por","his","geo","bio"];
const SUBJ = IDS.map(id => Object.assign({ id }, DATA[id]));
const KEY = "treino-exames:v2";
let hist = { s:{}, t:{}, best:{}, n:0, e:{} };
let S = { view:"home", sid:null, ti:0, cfg:null, fb:true, pool:[], i:0, picks:[], wrong:[], score:0, confirmReset:false };
const root = document.getElementById("app");

const cur = () => SUBJ.find(x => x.id === S.sid);
const topics = s => Object.keys(s.estudo);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

async function load(){
  try{
    let raw = null;
    try{ raw = localStorage.getItem(KEY); }catch(e){}
    if(raw === null && window.storage){
      try{ const r = await window.storage.get(KEY); raw = r && r.value; }catch(e){}
    }
    if(raw){ const h = JSON.parse(raw); hist = Object.assign({ s:{}, t:{}, best:{}, n:0, e:{} }, h); }
  }catch(e){ /* começa sem histórico */ }
  render();
}
async function save(){
  const raw = JSON.stringify(hist);
  try{ localStorage.setItem(KEY, raw); return; }catch(e){}
  try{ if(window.storage) await window.storage.set(KEY, raw); }catch(e){}
}

function prep(r, s){
  const idx = shuffle([0,1,2,3]);
  return { src:r, sid:s.id, sn:s.nome, cor:s.cor, t:r[0], q:r[1], o:idx.map(k => r[2][k]), c:idx.indexOf(r[3]), e:r[4] };
}

function start(cfg){
  let pool;
  if(cfg.wrong){
    pool = shuffle(S.wrong.map(w => prep(w.src, SUBJ.find(x => x.id === w.sid))));
  } else if(cfg.sid === "misto"){
    pool = shuffle(SUBJ.flatMap(s => s.q.map(r => prep(r, s)))).slice(0, cfg.n || 20);
  } else {
    const s = SUBJ.find(x => x.id === cfg.sid);
    let rows = s.q;
    if(cfg.topic) rows = rows.filter(r => r[0] === cfg.topic);
    pool = shuffle(rows.map(r => prep(r, s)));
    if(cfg.n && cfg.n < pool.length) pool = pool.slice(0, cfg.n);
  }
  const sid = cfg.wrong ? S.sid : (cfg.sid === "misto" ? null : cfg.sid);
  const keep = cfg.wrong ? S.cfg : cfg;
  S = Object.assign(S, { view:"quiz", sid, cfg:keep, fb:cfg.fb !== false, pool, i:0, picks:[], wrong:[], score:0 });
}

function finalize(p, k){
  const ok = k === p.c;
  if(ok) S.score++;
  else S.wrong.push({ sid:p.sid, src:p.src, t:p.t, sn:p.sn, q:p.q, mine: k === undefined ? "sem resposta" : p.o[k], right:p.o[p.c], e:p.e });
  const a = hist.s[p.sid] || (hist.s[p.sid] = { a:0, k:0 });
  a.a++; if(ok) a.k++;
  const key = p.sid + "|" + p.t;
  const t = hist.t[key] || (hist.t[key] = { a:0, k:0, sn:p.sn, t:p.t });
  t.a++; if(ok) t.k++;
}

function pick(k){
  const p = S.pool[S.i];
  if(S.fb){
    if(S.picks[S.i] !== undefined) return;
    S.picks[S.i] = k;
    finalize(p, k);
    save();
  } else {
    S.picks[S.i] = k;
  }
}

function next(){
  if(S.i + 1 < S.pool.length){ S.i++; return; }
  if(!S.fb) S.pool.forEach((p, i) => finalize(p, S.picks[i]));
  if(!S.fb && S.cfg && S.cfg.test){
    const pct = Math.round(S.score / S.pool.length * 100);
    hist.best[S.cfg.sid] = Math.max(hist.best[S.cfg.sid] || 0, pct);
  }
  hist.n++;
  save();
  S.view = "result";
}

function topicIndex(sid, t){
  const s = SUBJ.find(x => x.id === sid);
  return s ? topics(s).indexOf(t) : -1;
}

function viewHome(){
  const rows = SUBJ.map(s => {
    const a = hist.s[s.id];
    const pct = a ? Math.round(a.k / a.a * 100) : 0;
    const info = a ? `${a.k} certas em ${a.a} respostas (${pct}%)` : "ainda sem respostas";
    return `<button class="row" style="--c:${s.cor}" data-a="subject" data-s="${s.id}"><b>${s.nome}</b><span class="meta">${s.q.length} perguntas, ${topics(s).length} temas de estudo, ${info}</span><div class="bar"><i style="width:${pct}%"></i></div></button>`;
  }).join("");

  const weak = Object.keys(hist.t)
    .map(key => ({ sid:key.split("|")[0], t:hist.t[key] }))
    .filter(x => x.t.a >= 2 && x.t.k / x.t.a < 0.6)
    .sort((x, y) => x.t.k / x.t.a - y.t.k / y.t.a)
    .slice(0, 6);
  const weakHtml = weak.length
    ? `<ul class="weak">${weak.map(x => {
        const ti = topicIndex(x.sid, x.t.t);
        const inner = `<b>${x.t.t}</b><span class="meta">${x.t.sn}: ${x.t.k} certas em ${x.t.a} respostas${ti >= 0 ? ". Toque para estudar." : ""}</span>`;
        return `<li>${ti >= 0 ? `<button data-a="studyt" data-s="${x.sid}" data-ti="${ti}">${inner}</button>` : inner}</li>`;
      }).join("")}</ul>`
    : `<p class="empty">Os temas em que mais errar vão aparecer aqui, para saber o que estudar primeiro.</p>`;

  return `
    <h1>Treino para exames de admissão</h1>
    <p class="sub">Estude os resumos, treine por tema e faça testes completos em cada disciplina.</p>
    <button class="row mix" data-a="misto"><b>Simulado misto</b><span class="meta">20 perguntas sorteadas das ${SUBJ.length} disciplinas</span></button>
    ${EXAMS.length ? `<button class="row exm mix2" data-a="exlist"><b>Exames anteriores</b><span class="meta">${EXAMS.length} exames e ensaios, ${EXAMS.reduce((n, e) => n + e.q.length, 0)} perguntas, com resposta e explicação de cada uma</span></button>` : ""}
    ${rows}
    <h2>Temas a reforçar</h2>
    ${weakHtml}
    <button class="btn ghost small" data-a="reset">${S.confirmReset ? "Confirmar: apagar todo o histórico" : "Apagar histórico"}</button>
    <p class="note">Perguntas e resumos de apoio, não oficiais. Compare sempre com o programa do exame.</p>`;
}

function viewSubject(){
  const s = cur(), a = hist.s[s.id], b = hist.best[s.id];
  return `
    <div class="top"><button class="back" data-a="home">← Disciplinas</button></div>
    <h1 class="sh" style="--c:${s.cor}">${s.nome}</h1>
    <p class="sub">${a ? `${a.k} certas em ${a.a} respostas.` : "Ainda sem respostas."}${b !== undefined ? ` Melhor teste: ${b}%.` : ""}</p>
    <button class="act" data-a="studylist"><b>Estudar</b><span class="meta">${topics(s).length} temas com resumos e fórmulas</span></button>
    <button class="act" data-a="go" data-n="40" data-f="1"><b>Treino de 40 perguntas</b><span class="meta">correcção e explicação a cada resposta</span></button>
    <button class="act" data-a="go" data-n="40" data-f="0" data-test="1"><b>Teste de 40 perguntas</b><span class="meta">nota e correcção só no fim, como no exame</span></button>
    ${s.q.length >= 60 ? `<button class="act" data-a="go" data-n="60" data-f="1"><b>Treino de 60 perguntas</b><span class="meta">correcção e explicação a cada resposta</span></button>
    <button class="act" data-a="go" data-n="60" data-f="0" data-test="1"><b>Teste de 60 perguntas</b><span class="meta">nota e correcção só no fim, como no exame</span></button>` : ""}
    <button class="act" data-a="go" data-n="10" data-f="1"><b>10 perguntas rápidas</b><span class="meta">sorteadas, com correcção imediata</span></button>
    ${EXAMS.some(e => e.subj === s.id) ? `<button class="act" data-a="exlist"><b>Exames anteriores</b><span class="meta">${EXAMS.filter(e => e.subj === s.id).length} exames com resposta e explicação de cada pergunta</span></button>` : ""}`;
}

function viewStudyList(){
  const s = cur();
  const rows = topics(s).map((t, i) => {
    const n = s.q.filter(r => r[0] === t).length;
    const x = hist.t[s.id + "|" + t];
    const info = x ? `${x.k} certas em ${x.a} respostas` : (n ? `${n} perguntas` : "resumo de conteúdos de exame");
    return `<button class="row" style="--c:${s.cor}" data-a="studyt" data-s="${s.id}" data-ti="${i}"><b>${t}</b><span class="meta">${info}</span></button>`;
  }).join("");
  return `
    <div class="top"><button class="back" data-a="subject" data-s="${s.id}">← ${s.nome}</button></div>
    <h1>Estudar</h1>
    <p class="sub">Escolha um tema para ler o resumo.</p>
    ${rows}`;
}

function viewStudy(){
  const s = cur(), ts = topics(s), t = ts[S.ti], nx = ts[S.ti + 1];
  return `
    <div class="top"><button class="back" data-a="studylist">← Temas</button><span class="meta">${s.nome}, tema ${S.ti + 1} de ${ts.length}</span></div>
    <h1 class="sh" style="--c:${s.cor}">${t}</h1>
    <div class="estudo">${s.estudo[t]}</div>
    ${s.q.some(r => r[0] === t) ? `<button class="btn" data-a="gotopic">Treinar este tema</button>` : (EXAMS.some(e => e.subj === s.id) ? `<button class="btn" data-a="exlist">Praticar nos exames anteriores</button>` : "")}
    ${nx ? `<button class="btn ghost" data-a="studyt" data-s="${s.id}" data-ti="${S.ti + 1}">Tema seguinte: ${nx}</button>` : ""}`;
}

function viewQuiz(){
  const p = S.pool[S.i], n = S.pool.length, picked = S.picks[S.i], has = picked !== undefined;
  const lock = S.fb && has;
  const opts = p.o.map((txt, k) => {
    let cls = "opt", mark = String.fromCharCode(65 + k);
    if(S.fb && has){
      if(k === p.c){ cls += " ok"; mark = "✓"; }
      else if(k === picked){ cls += " bad"; mark = "✗"; }
      else cls += " dim";
    } else if(!S.fb && k === picked){ cls += " sel"; mark = "●"; }
    return `<button class="${cls}" data-a="pick" data-k="${k}" ${lock ? 'aria-disabled="true"' : ""}><span class="l">${mark}</span><span>${txt}</span></button>`;
  }).join("");
  let tail = "";
  if(S.fb && has){
    const ok = picked === p.c;
    tail += `<div class="fb ${ok ? "ok" : "bad"}" role="status"><strong>${ok ? "Certa." : "Errada. Resposta certa: " + p.o[p.c]}</strong>${p.e}</div>`;
  }
  if(has){
    tail += `<button class="btn" id="next" data-a="next">${S.i + 1 < n ? "Próxima pergunta" : (S.fb ? "Ver resultado" : "Terminar teste")}</button>`;
  }
  return `
    <div class="top"><button class="back" data-a="exit">← Sair</button><span class="meta">${S.fb ? "" : "Teste, "}${p.sn}, pergunta ${S.i + 1} de ${n}</span></div>
    <div class="bar prog" style="--c:${p.cor}"><i style="width:${(S.i + (S.fb && has ? 1 : 0)) / n * 100}%"></i></div>
    <p class="tema">Tema: ${p.t}</p>
    <h2 class="q">${p.q}</h2>
    ${opts}${tail}`;
}

function viewResult(){
  const n = S.pool.length, pct = Math.round(S.score / n * 100);
  const msg = pct >= 80 ? "Bom resultado." : pct >= 50 ? "Resultado razoável: vale rever os temas abaixo." : "Vale a pena repetir, começando pelos temas abaixo.";
  const seen = {}, temas = [];
  S.wrong.forEach(w => { const k = w.sid + "|" + w.t; if(!seen[k]){ seen[k] = 1; temas.push(w); } });
  const temasHtml = temas.length
    ? `<h2>Temas para rever</h2><ul class="weak">${temas.map(w => {
        const ti = topicIndex(w.sid, w.t);
        const inner = `<b>${w.t}</b><span class="meta">${w.sn}${ti >= 0 ? ". Toque para estudar." : ""}</span>`;
        return `<li>${ti >= 0 ? `<button data-a="studyt" data-s="${w.sid}" data-ti="${ti}">${inner}</button>` : inner}</li>`;
      }).join("")}</ul>`
    : `<p class="empty">Nenhum erro nesta ronda.</p>`;
  const review = (!S.fb && S.wrong.length)
    ? `<h2>Correcção das erradas</h2>${S.wrong.map(w => `<div class="rev"><p class="tema">${w.sn}, ${w.t}</p><p class="rq">${w.q}</p><p>A sua resposta: ${w.mine}</p><p>Resposta certa: <b>${w.right}</b></p><p class="meta">${w.e}</p></div>`).join("")}`
    : "";
  return `
    <h1>${msg}</h1>
    <div class="score">${S.score}<small> de ${n} (${pct}%)</small></div>
    ${temasHtml}
    ${review}
    <div style="margin-top:24px">
      ${S.wrong.length ? `<button class="btn" data-a="wrong">Rever só as que errei</button>` : ""}
      <button class="btn ${S.wrong.length ? "ghost" : ""}" data-a="again">Repetir</button>
      <button class="btn ghost" data-a="exit">${S.sid ? "Voltar à disciplina" : "Voltar ao início"}</button>
    </div>`;
}


/* ================= EXAMES ================= */
const EXAMS = window.EXAMS || [];
const SJ = { his:{ nome:"História", cor:"#B7791F" }, por:{ nome:"Português", cor:"#C8372D" } };
let X = null;
const exById = id => EXAMS.find(e => e.id === id);
const plain = s => String(s).replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
const isOpen = q => !q.o;
const rightOf = q => isOpen(q) ? q.r : q.o[q.c];
const okOf = (q, k) => isOpen(q) ? k === 1 : k === q.c;
const mineOf = (q, k) => k === undefined ? "sem resposta" : (isOpen(q) ? (k === 1 ? "Acertei (auto-avaliação)" : "Errei (auto-avaliação)") : q.o[k]);
const flagHtml = q => q.d ? `<p class="dub">Resposta a confirmar: o exame original não trazia gabarito e esta pergunta tem margem de dúvida. Confirme com o seu professor.</p>` : "";
const label = e => /^his-(ensaio|ficha)/.test(e.id) ? e.titulo : `${e.titulo}${e.titulo.indexOf(String(e.ano)) < 0 ? " " + e.ano : ""}`;

function startExam(id, fb, only){
  const ex = exById(id);
  const pool = only ? only.slice() : ex.q.slice();
  X = { id, ex, fb, partial: !!only, pool, i:0, picks:[], rev:[], done:false };
  S.view = "exquiz";
}
function exFinish(){
  X.done = true;
  X.score = X.pool.reduce((n, q, i) => n + (X.picks[i] !== undefined && okOf(q, X.picks[i]) ? 1 : 0), 0);
  if(!X.partial){
    const pct = Math.round(X.score / X.pool.length * 100);
    const h = hist.e[X.id] || (hist.e[X.id] = { runs:0, best:0, last:0 });
    h.runs++; h.last = pct; h.best = Math.max(h.best, pct);
    save();
  }
  S.view = "exresult";
}

function viewExList(){
  const groups = ["his","por"].map(sj => {
    const list = EXAMS.filter(e => e.subj === sj);
    if(!list.length) return "";
    const rows = list.map(e => {
      const h = hist.e[e.id];
      const chips = `<span class="chip">${e.q.length} perguntas</span>` + (e.tempo ? `<span class="chip">${e.tempo} min</span>` : "") + (h ? `<span class="chip best">melhor ${h.best}%</span>` : "") + (e.q.some(isOpen) ? `<span class="chip">resposta aberta</span>` : "");
      return `<button class="row exm" style="--c:${SJ[sj].cor}" data-a="exintro" data-id="${e.id}"><b>${label(e)}</b><span class="meta">${e.inst || ""}</span><div class="chips">${chips}</div></button>`;
    }).join("");
    return `<div class="hd" style="--c:${SJ[sj].cor}"><i></i><h2>${SJ[sj].nome}</h2></div>${rows}`;
  }).join("");
  return `
    <div class="top"><button class="back" data-a="home">← Início</button></div>
    <h1>Exames anteriores</h1>
    <p class="sub">Escolha um exame. Depois de cada resposta vê a resposta certa e a explicação, quer acerte ou erre.</p>
    ${groups}
    <p class="note">Os exames originais não traziam gabarito: as respostas foram resolvidas e explicadas para estudo. As marcadas «a confirmar» têm margem de dúvida.</p>`;
}

function viewExIntro(){
  const ex = X.ex, h = hist.e[ex.id], sj = SJ[ex.subj];
  return `
    <div class="top"><button class="back" data-a="exlist">← Exames</button></div>
    <h1 class="sh" style="--c:${sj.cor}">${label(ex)}</h1>
    <p class="sub">${sj.nome}${ex.inst ? " · " + ex.inst : ""}<br>${ex.q.length} perguntas${ex.tempo ? ", " + ex.tempo + " minutos no exame real" : ""}.${h ? ` Melhor resultado: ${h.best}%. Último: ${h.last}%.` : ""}</p>
    <div class="aviso">Cada pergunta traz a resposta certa e uma explicação. O exame original não tinha gabarito, por isso as respostas foram resolvidas à parte; as marcadas «a confirmar» merecem confirmação com o professor.</div>
    <button class="act" data-a="xgo" data-id="${ex.id}" data-f="1"><b>Treinar com correcção</b><span class="meta">resposta certa e explicação logo depois de cada pergunta</span></button>
    <button class="act" data-a="xgo" data-id="${ex.id}" data-f="0"><b>Fazer como exame</b><span class="meta">nota e correcção completa só no fim</span></button>`;
}

function viewExQuiz(){
  const ex = X.ex, q = X.pool[X.i], n = X.pool.length, has = X.picks[X.i] !== undefined;
  const lock = X.fb && has;
  const txt = q.tx != null && ex.textos ? `<details class="txt" open><summary>Texto de apoio</summary><div>${ex.textos[q.tx]}</div></details>` : "";
  let body = "";
  if(isOpen(q)){
    if(!X.rev[X.i]){
      body = `<button class="btn" data-a="xreveal">Mostrar resposta</button>`;
    } else {
      body = `<div class="fb ${has ? (okOf(q, X.picks[X.i]) ? "ok" : "bad") : ""}" role="status"><strong>Resposta</strong><span class="ans">${q.r}</span>${q.e}${flagHtml(q)}</div>`;
      if(!has) body += `<p class="meta" style="margin:0 0 8px">Acertou?</p><div class="row2"><button class="btn ok" data-a="xself" data-k="1">Acertei</button><button class="btn bad" data-a="xself" data-k="0">Errei</button></div>`;
    }
  } else {
    const picked = X.picks[X.i];
    body = q.o.map((txt, k) => {
      let cls = "opt", mark = String.fromCharCode(65 + k);
      if(X.fb && has){
        if(k === q.c){ cls += " ok"; mark = "✓"; }
        else if(k === picked){ cls += " bad"; mark = "✗"; }
        else cls += " dim";
      } else if(!X.fb && k === picked){ cls += " sel"; mark = "●"; }
      return `<button class="${cls}" data-a="xpick" data-k="${k}" ${lock ? 'aria-disabled="true"' : ""}><span class="l">${mark}</span><span>${txt}</span></button>`;
    }).join("");
    if(X.fb && has){
      const ok = picked === q.c;
      body += `<div class="fb ${ok ? "ok" : "bad"}" role="status"><strong>${ok ? "Certa." : "Errada. Resposta certa: " + q.o[q.c]}</strong>${q.e}${flagHtml(q)}</div>`;
    }
  }
  const canNext = X.fb ? has : true;
  const last = X.i + 1 >= n;
  const nav = (canNext ? `<button class="btn" id="next" data-a="xnext">${last ? (X.fb ? "Ver resultado" : "Terminar exame") : "Próxima pergunta"}</button>` : "")
            + (!X.fb && X.i > 0 ? `<button class="btn ghost" data-a="xprev">Pergunta anterior</button>` : "");
  return `
    <div class="top"><button class="back" data-a="xexit">← Sair</button><span class="meta">${X.fb ? "" : "Exame, "}pergunta ${X.i + 1} de ${n}</span></div>
    <div class="bar prog" style="--c:${SJ[ex.subj].cor}"><i style="width:${(X.i + (X.fb && has ? 1 : 0)) / n * 100}%"></i></div>
    <p class="tema">${label(ex)} · ${q.tema}</p>
    ${txt}
    <h2 class="q">${q.n != null ? q.n + ". " : ""}${q.p}</h2>
    ${body}${nav}`;
}

function viewExResult(){
  const n = X.pool.length, pct = Math.round(X.score / n * 100);
  const msg = pct >= 80 ? "Bom resultado." : pct >= 50 ? "Resultado razoável: reveja os temas abaixo." : "Vale a pena repetir, começando pelos temas abaixo.";
  const tm = {};
  X.pool.forEach((q, i) => { const t = tm[q.tema] || (tm[q.tema] = { a:0, k:0 }); t.a++; if(X.picks[i] !== undefined && okOf(q, X.picks[i])) t.k++; });
  const tmHtml = Object.keys(tm).map(t => { const p = Math.round(tm[t].k / tm[t].a * 100); return `<div class="tm"><div class="meta"><span>${t}</span><span>${tm[t].k} de ${tm[t].a}</span></div><div class="bar" style="--c:${SJ[X.ex.subj].cor}"><i style="width:${p}%"></i></div></div>`; }).join("");
  const wrong = [], right = [];
  X.pool.forEach((q, i) => (X.picks[i] !== undefined && okOf(q, X.picks[i]) ? right : wrong).push({ q, i }));
  const item = (w, ok, open) => `<details class="rv ${ok ? "" : "bad"}" ${open ? "open" : ""}><summary><span class="st">${ok ? "✓" : "✗"}</span><span>${w.q.n != null ? w.q.n + ". " : ""}${plain(w.q.p).slice(0, 110)}${plain(w.q.p).length > 110 ? "…" : ""}</span></summary><div class="rvb"><p class="rq">${w.q.p}</p>${ok ? "" : `<p>A sua resposta: ${mineOf(w.q, X.picks[w.i])}</p>`}<p>Resposta certa: <b>${rightOf(w.q)}</b></p><p class="meta">${w.q.e}</p>${flagHtml(w.q)}</div></details>`;
  return `
    <h1>${msg}</h1>
    <div class="score">${X.score}<small> de ${n} (${pct}%)</small></div>
    <h2>Por tema</h2>${tmHtml}
    ${wrong.length ? `<h2>Para rever (${wrong.length})</h2>${wrong.map(w => item(w, false, true)).join("")}` : `<p class="empty">Nenhum erro nesta ronda.</p>`}
    ${right.length ? `<h2>Certas (${right.length})</h2>${right.map(w => item(w, true, false)).join("")}` : ""}
    <div style="margin-top:24px">
      ${wrong.length ? `<button class="btn" data-a="xwrong">Rever só as que errei</button>` : ""}
      <button class="btn ${wrong.length ? "ghost" : ""}" data-a="xagain">Repetir exame</button>
      <button class="btn ghost" data-a="exlist">Voltar aos exames</button>
    </div>`;
}

function render(){
  const v = S.view;
  root.innerHTML = v === "home" ? viewHome() : v === "subject" ? viewSubject() : v === "studylist" ? viewStudyList() : v === "study" ? viewStudy() : v === "quiz" ? viewQuiz() : v === "exlist" ? viewExList() : v === "exintro" ? viewExIntro() : v === "exquiz" ? viewExQuiz() : v === "exresult" ? viewExResult() : viewResult();
  if(v === "quiz" && S.picks[S.i] !== undefined){
    const nb = document.getElementById("next");
    if(nb) nb.focus();
  } else if(v === "exquiz" && X && (X.picks[X.i] !== undefined || X.rev[X.i]) && X.fb){
    const nb = document.getElementById("next");
    if(nb) nb.focus({ preventScroll:true });
  } else {
    window.scrollTo(0, 0);
  }
}

root.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if(!b) return;
  const a = b.dataset.a;
  if(a === "subject"){ S.sid = b.dataset.s; S.view = "subject"; }
  else if(a === "home"){ S.view = "home"; S.sid = null; S.confirmReset = false; }
  else if(a === "studylist"){ S.view = "studylist"; }
  else if(a === "studyt"){ S.sid = b.dataset.s; S.ti = +b.dataset.ti; S.view = "study"; }
  else if(a === "gotopic"){ const s = cur(); start({ sid:s.id, topic:topics(s)[S.ti], fb:true }); }
  else if(a === "go"){ start({ sid:S.sid, n:+b.dataset.n, fb:b.dataset.f === "1", test:b.dataset.test === "1" }); }
  else if(a === "misto"){ start({ sid:"misto", n:20, fb:true }); }
  else if(a === "pick"){ pick(+b.dataset.k); }
  else if(a === "next"){ next(); }
  else if(a === "exit"){ S.view = S.sid ? "subject" : "home"; }
  else if(a === "again"){ start(S.cfg); }
  else if(a === "wrong"){ start({ wrong:true, fb:true }); }
  else if(a === "exlist"){ S.view = "exlist"; X = null; }
  else if(a === "exintro"){ X = { ex: exById(b.dataset.id) }; S.view = "exintro"; }
  else if(a === "xgo"){ startExam(b.dataset.id, b.dataset.f === "1"); }
  else if(a === "xpick"){ const q = X.pool[X.i]; if(!(X.fb && X.picks[X.i] !== undefined)) X.picks[X.i] = +b.dataset.k; }
  else if(a === "xreveal"){ X.rev[X.i] = true; }
  else if(a === "xself"){ if(X.picks[X.i] === undefined) X.picks[X.i] = +b.dataset.k; }
  else if(a === "xnext"){ if(X.i + 1 < X.pool.length) X.i++; else exFinish(); }
  else if(a === "xprev"){ if(X.i > 0) X.i--; }
  else if(a === "xexit"){ X = { ex: X.ex }; S.view = "exintro"; }
  else if(a === "xagain"){ startExam(X.id, X.fb); }
  else if(a === "xwrong"){ const ids = X.pool.filter((q, i) => !(X.picks[i] !== undefined && okOf(q, X.picks[i]))); startExam(X.id, true, ids); }
  else if(a === "reset"){
    if(!S.confirmReset) S.confirmReset = true;
    else { hist = { s:{}, t:{}, best:{}, n:0, e:{} }; S.confirmReset = false; save(); }
  }
  render();
});

render();
load();

if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
